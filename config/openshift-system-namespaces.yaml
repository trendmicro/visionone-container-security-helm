# Static, deterministic list of OpenShift system namespaces.
#
# Used ONLY to render the admission webhook's namespaceSelector NotIn list
# (helm/templates/validatingwebhook.yaml via the webhookExcludedNamespaces helper).
# Kubernetes label selectors cannot prefix-match, so the webhook needs explicit names here.
#
# To exclude ADDITIONAL namespaces, do NOT edit this file. Set them in your overrides.yaml
# (refer to values.yaml):
#   - visionOne.exclusion.namespaces
systemNamespaces:
  - dedicated-admin
  - default
  - kube-node-lease
  - kube-public
